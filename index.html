  <style>
    :root {
      --primary: #0A192F;
      --primary-light: #1E3A8A;
      --accent: #C5A059;
      --text-main: #334155;
      --text-light: #64748B;
      --bg-light: #F8FAFC;
      --white: #FFFFFF;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      color: var(--text-main);
      background-color: var(--white);
      line-height: 1.6;
    }

    /* Top Announcement Bar */
    .top-bar {
      background-color: var(--primary);
      color: var(--white);
      font-size: 0.85rem;
      padding: 8px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Header & Navigation */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 40px;
      object-fit: contain;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #0A192F 0%, #172554 100%);
      color: var(--white);
      padding: 80px 5%;
    }

      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }
